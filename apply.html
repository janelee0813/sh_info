<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>참여신청 | 마곡도시개발지구 복합용지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Freesentation/paperlogy@main/Paperlogy.css">
<style>
  :root {
    --ink-dark: #0B0D10;
    --ink-dark-soft: #55606E;
    --neutral-900: #171A1F;
    --neutral-500: #6B7280;
    --neutral-400: #9AA1AC;
    --neutral-200: #E5E7EB;
    --neutral-100: #F1F2F4;
    --neutral-50: #F7F8FA;
    --lime: #CFF24C;
    --lime-strong: #9BC200;
    --lime-deep: #5C7A00;
    --lime-wash: rgba(207,242,76,0.12);
    --red-wash: #FEF2F2;
    --red-ink: #DC2626;
    --radius-pill: 60px;
    --font-display: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-utility: ui-monospace, "SF Mono", "Roboto Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #fff;
    color: var(--ink-dark);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar (back + progress) ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(24px, env(safe-area-inset-top)) 24px 0;
  }
  .back-btn {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-500);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .back-btn:active { transform: scale(0.92); }
  .progress-wrap { flex: 1; }
  .progress-label {
    display: block;
    font-family: var(--font-utility);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--neutral-400);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 4px;
    border-radius: 999px;
    background: var(--neutral-200);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--lime);
    transition: width 0.5s ease-out;
  }

  /* ---------- Step container ---------- */
  .step-region {
    flex: 1;
    padding: 24px 24px 0;
    overflow-y: auto;
  }
  .step {
    opacity: 0;
    transform: translateY(20px);
  }
  .step.step-in {
    animation: stepIn 0.35s ease-out forwards;
  }
  .step.step-out {
    animation: stepOut 0.15s ease-in forwards;
  }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes stepOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-12px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .step, .step.step-in, .step.step-out { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  .footer-region {
    padding: 20px 24px max(24px, env(safe-area-inset-bottom));
  }

  /* ---------- Intro ---------- */
  .intro-shell {
    min-height: calc(100dvh - 0px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(40px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  .intro-eyebrow {
    display: inline-block;
    font-family: var(--font-utility);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--lime-deep);
    text-decoration: none;
  }
  .intro-sub-eyebrow {
    margin-top: 4px;
    font-family: var(--font-utility);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--neutral-400);
  }
  .intro-mid { display: flex; flex-direction: column; gap: 16px; }
  .intro-title {
    font-size: 28px;
    line-height: 1.35;
    font-weight: 800;
    color: var(--neutral-900);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .intro-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--neutral-500);
    margin: 0;
    font-weight: 500;
  }
  .intro-badge {
    margin-top: 4px;
    display: inline-flex;
    width: fit-content;
    align-items: center;
    gap: 8px;
    border-radius: var(--radius-pill);
    background: var(--lime-wash);
    color: var(--lime-deep);
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 800;
    font-family: var(--font-utility);
    letter-spacing: 0.03em;
  }

  /* ---------- Buttons ---------- */
  .btn-cta {
    width: 100%;
    appearance: none;
    border: none;
    cursor: pointer;
    background: var(--lime);
    color: var(--ink-dark);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    padding: 17px;
    border-radius: var(--radius-pill);
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  .btn-cta:active { transform: scale(0.98); }
  .btn-cta:hover:not(:disabled) { background: var(--lime-strong); }
  .btn-cta:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-outline {
    width: 100%;
    appearance: none;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--ink-dark);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    padding: 15px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }

  /* ---------- Step: 2 (info) ---------- */
  .step-title {
    font-size: 22px;
    line-height: 1.4;
    font-weight: 800;
    color: var(--neutral-900);
    margin: 0 0 28px;
    white-space: pre-line;
  }
  .info-section { display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--neutral-900); margin: 0; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--neutral-500);
    margin-bottom: 6px;
  }
  .field-label .req { color: var(--lime-deep); margin-left: 3px; }
  .field-input {
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--neutral-200);
    background: var(--neutral-50);
    padding: 13px 14px;
    font-size: 15px;
    color: var(--neutral-900);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .field-input:focus { border-color: var(--lime-deep); background: #fff; }
  .field-input::placeholder { color: var(--neutral-400); }

  .chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .chip-btn {
    appearance: none;
    cursor: pointer;
    text-align: left;
    border-radius: 12px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-700, #374151);
    padding: 12px 14px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
    transition: all 0.15s ease;
  }
  .chip-btn:active { transform: scale(0.98); }
  .chip-btn:hover { border-color: var(--neutral-400); }
  .chip-btn.selected {
    border-color: var(--lime-deep);
    background: var(--lime);
    color: var(--ink-dark);
    font-weight: 800;
  }

  /* ---------- Step: 3 (consent) ---------- */
  .consent-box {
    border-radius: 16px;
    border: 1px solid var(--neutral-200);
    background: var(--neutral-50);
    padding: 16px;
    margin-bottom: 20px;
  }
  .consent-box .ttl { font-size: 13px; font-weight: 800; color: var(--neutral-900); margin: 0 0 8px; }
  .consent-box .body { font-size: 12px; line-height: 1.7; color: var(--neutral-500); margin: 0; white-space: pre-line; }
  .consent-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 16px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    padding: 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .consent-toggle.on { border-color: var(--lime-deep); background: var(--lime-wash); }
  .consent-check {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--neutral-200);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
  }
  .consent-toggle.on .consent-check { border-color: var(--lime-deep); background: var(--lime-deep); }
  .consent-toggle .label { font-size: 14px; font-weight: 600; color: var(--neutral-900); }

  .error-box {
    border-radius: 12px;
    background: var(--red-wash);
    color: var(--red-ink);
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 16px;
  }

  /* ---------- Success ---------- */
  .success-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
  }
  .success-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--lime-wash);
    color: var(--lime-deep);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .success-shell h1 { font-size: 21px; font-weight: 800; color: var(--neutral-900); margin: 0 0 10px; }
  .success-shell p { font-size: 14px; line-height: 1.7; color: var(--neutral-500); margin: 0 0 28px; max-width: 32ch; font-weight: 500; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app-shell" id="appShell"></div>

<script>
(function () {
  var SUPABASE_URL = "https://cbrowpkzgvomnrbyiadd.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicm93cGt6Z3ZvbW5yYnlpYWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzM2NTgsImV4cCI6MjEwMTY0OTY1OH0.nAGpSLkvAiqwvZ3fARBrsHrZbgmzcCFGxSIVYrB5wDA";

  var HEADCOUNT_OPTIONS = [
    { value: "1", label: "1명" },
    { value: "2", label: "2명" },
    { value: "3", label: "3명" },
    { value: "4+", label: "4명 이상" }
  ];
  var INTEREST_OPTIONS = [
    { value: "사옥 이전", label: "사옥 이전" },
    { value: "투자 검토", label: "투자 검토" },
    { value: "임대 문의", label: "임대 문의" },
    { value: "기타", label: "기타" }
  ];

  var TOTAL_STEPS = 2; // info, consent

  var state = {
    phase: "intro", // intro | info | consent | submitting | error | success
    fields: { company: "", manager: "", position: "", phone: "", email: "", headcount: "" },
    interests: [],
    consent: false,
    errorMessage: ""
  };

  var root = document.getElementById("appShell");

  function esc(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function isInfoValid() {
    var f = state.fields;
    return f.company.trim().length > 0 &&
      f.manager.trim().length > 0 &&
      f.phone.trim().length > 0 &&
      f.email.trim().length > 0 &&
      f.headcount.length > 0;
  }

  function stepNumberFor(phase) {
    if (phase === "info") return 1;
    if (phase === "consent" || phase === "submitting" || phase === "error") return 2;
    return 0;
  }

  function topBarHtml() {
    var step = stepNumberFor(state.phase);
    var pct = Math.min(100, Math.round((step / TOTAL_STEPS) * 100));
    return (
      '<div class="topbar">' +
        '<button type="button" class="back-btn" id="backBtn" aria-label="이전 단계로">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>' +
        '</button>' +
        '<div class="progress-wrap">' +
          '<span class="progress-label">STEP ' + String(step).padStart(2, "0") + ' / ' + String(TOTAL_STEPS).padStart(2, "0") + '</span>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function fieldHtml(id, label, placeholder, type, required, value) {
    return (
      '<div>' +
        '<label class="field-label" for="' + id + '">' + label + (required ? '<span class="req">*</span>' : '') + '</label>' +
        '<input class="field-input" id="' + id + '" type="' + type + '" placeholder="' + esc(placeholder) + '" value="' + esc(value) + '" ' + (type === 'tel' ? 'inputmode="tel"' : '') + ' />' +
      '</div>'
    );
  }

  function renderIntro() {
    root.innerHTML =
      '<div class="intro-shell">' +
        '<div>' +
          '<a class="intro-eyebrow" href="index.html">SH · 서울주택도시개발공사</a>' +
          '<div class="intro-sub-eyebrow">APPLICATION · 참여신청</div>' +
        '</div>' +
        '<div class="intro-mid">' +
          '<h1 class="intro-title">사업설명회 참여신청을<br />시작합니다.</h1>' +
          '<p class="intro-desc">정보를 남겨주시면 검토 후<br />사업설명회 초청장을 이메일로 보내드립니다.</p>' +
          '<span class="intro-badge">약 1분이면 신청 완료</span>' +
        '</div>' +
        '<button type="button" class="btn-cta" id="startBtn">신청 시작하기</button>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", function () {
      goTo("info");
    });
  }

  function renderInfoStep() {
    var f = state.fields;
    var headcountChips = HEADCOUNT_OPTIONS.map(function (opt) {
      var sel = f.headcount === opt.value;
      return '<button type="button" class="chip-btn' + (sel ? ' selected' : '') + '" data-headcount="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    var interestChips = INTEREST_OPTIONS.map(function (opt) {
      var sel = state.interests.indexOf(opt.value) > -1;
      return '<button type="button" class="chip-btn' + (sel ? ' selected' : '') + '" data-interest="' + esc(opt.value) + '">' + opt.label + '</button>';
    }).join("");

    return (
      '<h2 class="step-title">참여 정보를<br />입력해주세요.</h2>' +
      '<div class="info-section">' +
        '<h3 class="section-title">담당자님의 성함과 연락처를 입력해 주세요.</h3>' +
        fieldHtml("f-manager", "담당자명", "홍길동", "text", true, f.manager) +
        fieldHtml("f-phone", "연락처", "010-0000-0000", "tel", true, f.phone) +
        fieldHtml("f-email", "이메일", "name@company.com", "email", true, f.email) +
      '</div>' +
      '<div class="info-section">' +
        '<h3 class="section-title">소속 기업명과 직급/부서를 알려주세요.</h3>' +
        fieldHtml("f-company", "기업명", "예) 마곡산업(주)", "text", true, f.company) +
        fieldHtml("f-position", "직급 / 부서", "사업개발팀 팀장", "text", false, f.position) +
      '</div>' +
      '<div class="info-section">' +
        '<h3 class="section-title">사업설명회 참석 인원을 선택해 주세요.<span class="req" style="color:var(--lime-deep)">*</span></h3>' +
        '<div class="chip-grid" id="headcountGroup">' + headcountChips + '</div>' +
      '</div>' +
      '<div class="info-section" style="margin-bottom:8px;">' +
        '<h3 class="section-title">관심 분야를 선택해 주세요. (복수 선택 가능)</h3>' +
        '<div class="chip-grid" id="interestGroup">' + interestChips + '</div>' +
      '</div>'
    );
  }

  function bindInfoStep() {
    ["manager", "phone", "email", "company", "position"].forEach(function (key) {
      var el = document.getElementById("f-" + key);
      el.addEventListener("input", function () {
        state.fields[key] = el.value;
        updateFooterButtonState();
      });
    });
    document.getElementById("headcountGroup").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-headcount]");
      if (!btn) return;
      state.fields.headcount = btn.getAttribute("data-headcount");
      renderStep(true);
    });
    document.getElementById("interestGroup").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-interest]");
      if (!btn) return;
      var v = btn.getAttribute("data-interest");
      var idx = state.interests.indexOf(v);
      if (idx > -1) state.interests.splice(idx, 1);
      else state.interests.push(v);
      renderStep(true);
    });
  }

  function renderConsentStep() {
    var errorHtml = "";
    if (state.phase === "error" && state.errorMessage) {
      errorHtml = '<p class="error-box">' + esc(state.errorMessage) + '</p>';
    }
    return (
      '<h2 class="step-title">마지막으로,<br />약관에 동의해주세요.</h2>' +
      '<div class="consent-box">' +
        '<p class="ttl">개인정보 수집 및 이용 동의</p>' +
        '<p class="body">수집 항목: 기업명, 담당자명, 직급/부서, 연락처, 이메일, 참석 인원, 관심 분야\n수집 목적: 사업설명회 초청장 발송 및 참여 상담\n위 항목은 사업설명회 초청 및 상담 목적으로만 사용되며, 동의를 거부할 권리가 있습니다. 다만 미동의 시 참여신청이 제한됩니다.</p>' +
      '</div>' +
      '<button type="button" class="consent-toggle' + (state.consent ? ' on' : '') + '" id="consentToggle">' +
        '<span class="consent-check">' + (state.consent ? "✓" : "") + '</span>' +
        '<span class="label">개인정보 수집 및 이용에 동의합니다.</span>' +
      '</button>' +
      errorHtml
    );
  }

  function bindConsentStep() {
    document.getElementById("consentToggle").addEventListener("click", function () {
      state.consent = !state.consent;
      renderStep(true);
    });
  }

  function footerHtml() {
    if (state.phase === "info") {
      return '<button type="button" class="btn-cta" id="nextBtn" ' + (isInfoValid() ? "" : "disabled") + '>다음</button>';
    }
    if (state.phase === "consent" || state.phase === "error") {
      return '<button type="button" class="btn-cta" id="submitBtn" ' + (state.consent ? "" : "disabled") + '>신청 제출하기</button>';
    }
    if (state.phase === "submitting") {
      return '<button type="button" class="btn-cta" disabled style="opacity:0.6;">제출하고 있습니다...</button>';
    }
    return "";
  }

  function bindFooter() {
    if (state.phase === "info") {
      document.getElementById("nextBtn").addEventListener("click", function () {
        if (!isInfoValid()) return;
        goTo("consent");
      });
    } else if (state.phase === "consent" || state.phase === "error") {
      document.getElementById("submitBtn").addEventListener("click", submitApplication);
    }
  }

  function updateFooterButtonState() {
    var nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.disabled = !isInfoValid();
    var submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.disabled = !state.consent;
  }

  function renderStep(skipAnim) {
    var bodyHtml = state.phase === "info" ? renderInfoStep() : renderConsentStep();
    root.innerHTML =
      topBarHtml() +
      '<div class="step-region"><div class="step" id="stepInner">' + bodyHtml + '</div></div>' +
      '<div class="footer-region">' + footerHtml() + '</div>';

    document.getElementById("backBtn").addEventListener("click", handleBack);
    if (state.phase === "info") bindInfoStep();
    else bindConsentStep();
    bindFooter();

    var stepEl = document.getElementById("stepInner");
    if (!skipAnim) {
      requestAnimationFrame(function () { stepEl.classList.add("step-in"); });
    } else {
      stepEl.classList.add("step-in");
    }
  }

  function renderSuccess() {
    root.innerHTML =
      '<div class="success-shell">' +
        '<div class="success-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h1>신청이 접수되었습니다</h1>' +
        '<p>담당자 검토 후 입력하신 이메일로<br />사업설명회 초청장을 보내드립니다.</p>' +
        '<a href="index.html" class="btn-outline" style="text-decoration:none;display:block;text-align:center;">메인으로 돌아가기</a>' +
      '</div>';
  }

  function handleBack() {
    if (state.phase === "info") {
      goTo("intro");
    } else if (state.phase === "consent" || state.phase === "error") {
      state.errorMessage = "";
      goTo("info");
    }
  }

  function goTo(phase) {
    state.phase = phase;
    if (phase === "intro") {
      renderIntro();
      return;
    }
    if (phase === "success") {
      renderSuccess();
      return;
    }
    renderStep(false);
  }

  function submitApplication() {
    state.phase = "submitting";
    renderStep(true);

    var payload = {
      company: state.fields.company.trim(),
      manager_name: state.fields.manager.trim(),
      position: state.fields.position.trim() || null,
      phone: state.fields.phone.trim(),
      email: state.fields.email.trim(),
      headcount: state.fields.headcount,
      interests: state.interests,
      consent: state.consent
    };

    fetch(SUPABASE_URL + "/rest/v1/applications", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("request failed: " + res.status);
        goTo("success");
      })
      .catch(function () {
        state.errorMessage = "제출 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.";
        state.phase = "error";
        renderStep(true);
      });
  }

  goTo("intro");
})();
</script>

</body>
</html>
