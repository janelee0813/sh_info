<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>참여신청 | 마곡도시개발지구 복합용지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Freesentation/paperlogy@main/Paperlogy.css">
<style>
  :root {
    --ink-dark: #0B0D10;
    --ink-dark-soft: #55606E;
    --neutral-900: #171A1F;
    --neutral-500: #6B7280;
    --neutral-400: #9AA1AC;
    --neutral-200: #E5E7EB;
    --neutral-100: #F1F2F4;
    --neutral-50: #F7F8FA;
    --lime: #CFF24C;
    --lime-strong: #9BC200;
    --lime-deep: #5C7A00;
    --lime-wash: rgba(207,242,76,0.12);
    --red-wash: #FEF2F2;
    --red-ink: #DC2626;
    --radius-pill: 60px;
    --font-display: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-utility: ui-monospace, "SF Mono", "Roboto Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #fff;
    color: var(--ink-dark);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar (back + progress) ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(24px, env(safe-area-inset-top)) 24px 0;
  }
  .back-btn {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-500);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .back-btn:active { transform: scale(0.92); }
  .progress-wrap { flex: 1; }
  .progress-label {
    display: block;
    font-family: var(--font-utility);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--neutral-400);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 4px;
    border-radius: 999px;
    background: var(--neutral-200);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--lime);
    transition: width 0.5s ease-out;
  }

  /* ---------- Step container ---------- */
  .step-region {
    flex: 1;
    padding: 24px 24px 0;
    overflow-y: auto;
  }
  .step {
    opacity: 0;
    transform: translateY(20px);
  }
  .step.step-in {
    animation: stepIn 0.35s ease-out forwards;
  }
  /* 같은 단계 안에서 선택지만 바뀔 때는 다시 날아들어오지 않고 그대로 보이게 한다 */
  .step.step-static {
    opacity: 1;
    transform: none;
  }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .step, .step.step-in, .step.step-static { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  .footer-region {
    padding: 20px 24px max(24px, env(safe-area-inset-bottom));
  }

  /* ---------- Intro ---------- */
  .intro-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(40px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  .intro-eyebrow {
    display: inline-block;
    font-family: var(--font-utility);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--lime-deep);
    text-decoration: none;
  }
  .intro-sub-eyebrow {
    margin-top: 4px;
    font-family: var(--font-utility);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--neutral-400);
  }
  .intro-mid { display: flex; flex-direction: column; gap: 16px; }
  .intro-title {
    font-size: 27px;
    line-height: 1.35;
    font-weight: 800;
    color: var(--neutral-900);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .intro-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--neutral-500);
    margin: 0;
    font-weight: 500;
  }
  .intro-contact {
    font-size: 12px;
    line-height: 1.7;
    color: var(--neutral-400);
    margin: 0;
    font-weight: 500;
  }
  .intro-badge {
    margin-top: 4px;
    display: inline-flex;
    width: fit-content;
    align-items: center;
    gap: 8px;
    border-radius: var(--radius-pill);
    background: var(--lime-wash);
    color: var(--lime-deep);
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 800;
    font-family: var(--font-utility);
    letter-spacing: 0.03em;
  }

  /* ---------- Buttons ---------- */
  .btn-cta {
    width: 100%;
    appearance: none;
    border: none;
    cursor: pointer;
    background: var(--lime);
    color: var(--ink-dark);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    padding: 17px;
    border-radius: var(--radius-pill);
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  .btn-cta:active { transform: scale(0.98); }
  .btn-cta:hover:not(:disabled) { background: var(--lime-strong); }
  .btn-cta:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-outline {
    width: 100%;
    appearance: none;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--ink-dark);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    padding: 15px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }

  /* ---------- Step titles / sections ---------- */
  .step-title {
    font-size: 22px;
    line-height: 1.4;
    font-weight: 800;
    color: var(--neutral-900);
    margin: 0 0 10px;
    white-space: pre-line;
  }
  .step-note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--neutral-500);
    margin: 0 0 24px;
    font-weight: 500;
  }
  .info-section { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--neutral-500);
    margin-bottom: 6px;
  }
  .field-label .req { color: var(--lime-deep); margin-left: 3px; }
  .field-input {
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--neutral-200);
    background: var(--neutral-50);
    padding: 13px 14px;
    font-size: 15px;
    color: var(--neutral-900);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .field-input:focus { border-color: var(--lime-deep); background: #fff; }
  .field-input::placeholder { color: var(--neutral-400); }

  .chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .chip-btn {
    appearance: none;
    cursor: pointer;
    text-align: center;
    border-radius: 12px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-900);
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    transition: all 0.15s ease;
  }
  .chip-btn:active { transform: scale(0.98); }
  .chip-btn:hover { border-color: var(--neutral-400); }
  .chip-btn.selected {
    border-color: var(--lime-deep);
    background: var(--lime);
    color: var(--ink-dark);
  }

  .option-card {
    display: block;
    width: 100%;
    text-align: left;
    border-radius: 14px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-900);
    padding: 15px 16px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    white-space: pre-line;
    transition: all 0.15s ease;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .option-card:active { transform: scale(0.99); }
  .option-card:hover { border-color: var(--neutral-400); }
  .option-card.selected {
    border-color: var(--lime-deep);
    background: var(--lime-wash);
    box-shadow: inset 0 0 0 1px var(--lime-deep);
    font-weight: 800;
  }

  .companion-card {
    border-radius: 16px;
    border: 1px solid var(--neutral-200);
    background: var(--neutral-50);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .companion-card .ttl { font-size: 13px; font-weight: 800; color: var(--neutral-900); margin: 0; }

  /* ---------- Consent ---------- */
  .consent-box {
    border-radius: 16px;
    border: 1px solid var(--neutral-200);
    background: var(--neutral-50);
    padding: 16px;
    margin-bottom: 20px;
  }
  .consent-box .ttl { font-size: 13px; font-weight: 800; color: var(--neutral-900); margin: 0 0 8px; }
  .consent-box .body { font-size: 12px; line-height: 1.8; color: var(--neutral-500); margin: 0; white-space: pre-line; }
  .consent-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 16px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    padding: 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .consent-toggle.on { border-color: var(--lime-deep); background: var(--lime-wash); }
  .consent-check {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--neutral-200);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
  }
  .consent-toggle.on .consent-check { border-color: var(--lime-deep); background: var(--lime-deep); }
  .consent-toggle .label { font-size: 14px; font-weight: 600; color: var(--neutral-900); }

  .consent-choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .consent-choice-btn {
    appearance: none;
    cursor: pointer;
    border-radius: 14px;
    border: 1px solid var(--neutral-200);
    background: #fff;
    color: var(--neutral-900);
    padding: 16px 10px;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.15s ease;
  }
  .consent-choice-btn.selected {
    border-color: var(--lime-deep);
    background: var(--lime);
    color: var(--ink-dark);
  }
  .consent-choice-btn.selected.decline {
    border-color: var(--neutral-400);
    background: var(--neutral-200);
    color: var(--neutral-900);
  }

  .error-box {
    border-radius: 12px;
    background: var(--red-wash);
    color: var(--red-ink);
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 16px;
  }

  /* ---------- Success ---------- */
  .success-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
  }
  .success-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--lime-wash);
    color: var(--lime-deep);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .success-shell h1 { font-size: 21px; font-weight: 800; color: var(--neutral-900); margin: 0 0 10px; }
  .success-shell p { font-size: 14px; line-height: 1.7; color: var(--neutral-500); margin: 0 0 28px; max-width: 32ch; font-weight: 500; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app-shell" id="appShell"></div>

<script>
(function () {
  var SUPABASE_URL = "https://cbrowpkzgvomnrbyiadd.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicm93cGt6Z3ZvbW5yYnlpYWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzM2NTgsImV4cCI6MjEwMTY0OTY1OH0.nAGpSLkvAiqwvZ3fARBrsHrZbgmzcCFGxSIVYrB5wDA";

  var SITE_OPTIONS = [
    { value: "site_1", label: "1) 5호선 발산역 대형 부지\n(L4, L5, L6)" },
    { value: "site_2", label: "2) 5호선 발산역 인접 중소형 부지\n(L5-3,4,5,6 및 L7-1,2,3)" },
    { value: "site_3", label: "3) 올림픽대로 인접 중소형 부지\n(L1-1,2,3, L2-1,2,3, L3-1,2,3)" }
  ];

  var STEP_NAMES = ["applicant", "companions", "site", "consent", "consent2"];
  var TOTAL_STEPS = STEP_NAMES.length;

  var state = {
    phase: "intro",
    applicant: { company: "", department: "", name: "", position: "", phone: "", email: "" },
    companionCount: null, // 0 | 1 | 2
    companions: [],
    interestedSite: null,
    privacyConsent: false,
    marketingConsent: null, // true | false
    errorMessage: ""
  };

  var root = document.getElementById("appShell");

  function esc(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // 숫자만 남긴 뒤 서울(02)/휴대전화·기타 지역번호 자리수에 맞춰 하이픈을 자동으로 넣어준다.
  function formatKoreanPhone(v) {
    var d = (v || "").replace(/\D/g, "").slice(0, 11);
    if (d.indexOf("02") === 0) {
      if (d.length < 3) return d;
      if (d.length < 6) return d.slice(0, 2) + "-" + d.slice(2);
      if (d.length < 10) return d.slice(0, 2) + "-" + d.slice(2, 5) + "-" + d.slice(5);
      return d.slice(0, 2) + "-" + d.slice(2, 6) + "-" + d.slice(6, 10);
    }
    if (d.length < 4) return d;
    if (d.length < 7) return d.slice(0, 3) + "-" + d.slice(3);
    if (d.length < 11) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
    return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 11);
  }

  // 커서 위치(입력 중이던 자리)를 최대한 유지하면서 입력창 값에 하이픈 서식을 적용한다.
  function applyPhoneFormatting(input) {
    var digitsBeforeCursor = input.value.slice(0, input.selectionStart).replace(/\D/g, "").length;
    var formatted = formatKoreanPhone(input.value);
    input.value = formatted;
    var count = 0, pos = formatted.length;
    for (var i = 0; i < formatted.length; i++) {
      if (/\d/.test(formatted[i])) count++;
      if (count === digitsBeforeCursor) { pos = i + 1; break; }
    }
    input.setSelectionRange(pos, pos);
    return formatted;
  }

  function isApplicantValid() {
    var a = state.applicant;
    return a.company.trim().length > 0 && a.name.trim().length > 0 &&
      a.phone.trim().length > 0 && a.email.trim().length > 0;
  }

  function isCompanionsValid() {
    if (state.companionCount === null) return false;
    for (var i = 0; i < state.companionCount; i++) {
      var c = state.companions[i] || {};
      if (!(c.name || "").trim() || !(c.phone || "").trim() || !(c.email || "").trim()) return false;
    }
    return true;
  }

  function stepNumberFor(phase) {
    var normalized = (phase === "error" || phase === "submitting") ? "consent2" : phase;
    var idx = STEP_NAMES.indexOf(normalized);
    return idx > -1 ? idx + 1 : 0;
  }

  function topBarHtml() {
    var step = stepNumberFor(state.phase);
    var pct = Math.min(100, Math.round((step / TOTAL_STEPS) * 100));
    var backBtnHtml = state.phase === "submitting"
      ? '<span class="back-btn" style="opacity:0.3;" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg></span>'
      : '<button type="button" class="back-btn" id="backBtn" aria-label="이전 단계로">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>' +
        '</button>';
    return (
      '<div class="topbar">' +
        backBtnHtml +
        '<div class="progress-wrap">' +
          '<span class="progress-label">STEP ' + String(step).padStart(2, "0") + ' / ' + String(TOTAL_STEPS).padStart(2, "0") + '</span>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function fieldHtml(id, label, placeholder, type, required, value) {
    return (
      '<div>' +
        '<label class="field-label" for="' + id + '">' + label + (required ? '<span class="req">*</span>' : '') + '</label>' +
        '<input class="field-input" id="' + id + '" type="' + type + '" placeholder="' + esc(placeholder) + '" value="' + esc(value) + '" ' + (type === 'tel' ? 'inputmode="tel"' : '') + ' />' +
      '</div>'
    );
  }

  function renderIntro() {
    root.innerHTML =
      '<div class="intro-shell">' +
        '<div>' +
          '<a class="intro-eyebrow" href="index.html">SH · 서울주택도시개발공사</a>' +
          '<div class="intro-sub-eyebrow">2026 SH 마곡일반산업단지 매각설명회</div>' +
        '</div>' +
        '<div class="intro-mid">' +
          '<h1 class="intro-title">2026 SH 마곡일반산업단지<br />매각설명회 참여 신청</h1>' +
          '<p class="intro-desc">사옥 건립 및 R&amp;D 센터 확장을 위해 마곡지구에 관심 있는 기업 담당자분들을 모시고 공급 대상 용지를 소개해 드리는 설명회입니다. 현장을 직접 확인하실 수 있는 투어도 함께 진행됩니다.</p>' +
          '<p class="intro-contact">문의 · 예이프로젝트 안미나 대표 컨설턴트<br />shinvest2024@gmail.com · 010-7541-1002</p>' +
          '<span class="intro-badge">약 1분이면 신청 완료</span>' +
        '</div>' +
        '<button type="button" class="btn-cta" id="startBtn">신청 시작하기</button>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", function () {
      goTo("applicant");
    });
  }

  function renderApplicantStep() {
    var a = state.applicant;
    return (
      '<h2 class="step-title">신청자 정보를<br />입력해주세요.</h2>' +
      '<div class="info-section">' +
        fieldHtml("f-company", "소속 기업(기관)", "예) 마곡산업(주)", "text", true, a.company) +
        fieldHtml("f-department", "부서", "사업개발팀", "text", false, a.department) +
        fieldHtml("f-name", "성명", "홍길동", "text", true, a.name) +
        fieldHtml("f-position", "직함", "팀장", "text", false, a.position) +
        fieldHtml("f-phone", "연락처", "010-0000-0000", "tel", true, a.phone) +
        fieldHtml("f-email", "이메일", "name@company.com", "email", true, a.email) +
      '</div>'
    );
  }

  function bindApplicantStep() {
    ["company", "department", "name", "position", "phone", "email"].forEach(function (key) {
      var el = document.getElementById("f-" + key);
      el.addEventListener("input", function () {
        state.applicant[key] = key === "phone" ? applyPhoneFormatting(el) : el.value;
        updateFooterButtonState();
      });
    });
  }

  function companionFieldHtml(idx, key, label, placeholder, type, required) {
    var c = state.companions[idx] || {};
    var id = "comp-" + idx + "-" + key;
    return (
      '<div>' +
        '<label class="field-label" for="' + id + '">' + label + (required ? '<span class="req">*</span>' : '') + '</label>' +
        '<input class="field-input" id="' + id + '" data-comp-idx="' + idx + '" data-comp-key="' + key + '" type="' + type + '" placeholder="' + esc(placeholder) + '" value="' + esc(c[key]) + '" ' + (type === 'tel' ? 'inputmode="tel"' : '') + ' />' +
      '</div>'
    );
  }

  function renderCompanionsStep() {
    var counts = [
      { value: 0, label: "없음" },
      { value: 1, label: "1명" },
      { value: 2, label: "2명" }
    ];
    var chips = counts.map(function (c) {
      var sel = state.companionCount === c.value;
      return '<button type="button" class="chip-btn' + (sel ? ' selected' : '') + '" data-count="' + c.value + '">' + c.label + '</button>';
    }).join("");

    var companionBlocks = "";
    if (state.companionCount) {
      for (var i = 0; i < state.companionCount; i++) {
        companionBlocks +=
          '<div class="companion-card">' +
            '<p class="ttl">동반 참석자 ' + (i + 1) + '</p>' +
            companionFieldHtml(i, "name", "성명", "홍길동", "text", true) +
            companionFieldHtml(i, "position", "직책", "과장", "text", false) +
            companionFieldHtml(i, "phone", "연락처", "010-0000-0000", "tel", true) +
            companionFieldHtml(i, "email", "이메일", "name@company.com", "email", true) +
          '</div>';
      }
    }

    return (
      '<h2 class="step-title">동반 참석자가<br />있으신가요?</h2>' +
      '<p class="step-note">좌석 제한으로 인해 기업별 최대 3인(신청자 본인 포함)까지 참석 가능합니다.</p>' +
      '<div class="chip-grid" id="companionCountGroup">' + chips + '</div>' +
      '<div style="margin-top:18px;">' + companionBlocks + '</div>'
    );
  }

  function bindCompanionsStep() {
    document.getElementById("companionCountGroup").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-count]");
      if (!btn) return;
      var count = parseInt(btn.getAttribute("data-count"), 10);
      state.companionCount = count;
      var next = [];
      for (var i = 0; i < count; i++) next.push(state.companions[i] || { name: "", position: "", phone: "", email: "" });
      state.companions = next;
      renderStep(false);
    });
    root.querySelectorAll("[data-comp-idx]").forEach(function (el) {
      el.addEventListener("input", function () {
        var idx = parseInt(el.getAttribute("data-comp-idx"), 10);
        var key = el.getAttribute("data-comp-key");
        state.companions[idx][key] = key === "phone" ? applyPhoneFormatting(el) : el.value;
        updateFooterButtonState();
      });
    });
  }

  function renderSiteStep() {
    var options = SITE_OPTIONS.map(function (opt) {
      var sel = state.interestedSite === opt.value;
      return '<button type="button" class="option-card' + (sel ? ' selected' : '') + '" data-site="' + opt.value + '">' + esc(opt.label) + '</button>';
    }).join("");
    return (
      '<h2 class="step-title">관심 있는 부지가<br />있다면 선택해 주세요.</h2>' +
      '<p class="step-note">선택하지 않으셔도 신청에는 제한이 없습니다.</p>' +
      '<div>' + options + '</div>'
    );
  }

  function bindSiteStep() {
    root.querySelectorAll("[data-site]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.getAttribute("data-site");
        state.interestedSite = state.interestedSite === v ? null : v;
        renderStep(false);
      });
    });
  }

  function renderConsentStep() {
    return (
      '<h2 class="step-title">개인정보 수집과 이용에<br />동의해주세요.</h2>' +
      '<div class="consent-box">' +
        '<p class="ttl">개인정보 수집 및 이용 동의 (필수)</p>' +
        '<p class="body">수집하는 자 : 예이프로젝트\n수집 목적 : SH 토지매각설명회 행사 운영\n수집 항목 : 이름, 연락처, 이메일, 소속, 직책, 관심 용지 등\n보유 및 이용 기간 : 수집일 이후 1년\n\n동의를 거부할 권리가 있으며, 거부 시 행사 안내가 진행되지 않습니다.</p>' +
      '</div>' +
      '<button type="button" class="consent-toggle' + (state.privacyConsent ? ' on' : '') + '" id="consentToggle">' +
        '<span class="consent-check">' + (state.privacyConsent ? "✓" : "") + '</span>' +
        '<span class="label">개인정보 수집 및 이용에 동의합니다.</span>' +
      '</button>'
    );
  }

  function bindConsentStep() {
    document.getElementById("consentToggle").addEventListener("click", function () {
      state.privacyConsent = !state.privacyConsent;
      renderStep(false);
    });
  }

  function renderConsent2Step() {
    var errorHtml = "";
    if (state.phase === "error" && state.errorMessage) {
      errorHtml = '<p class="error-box">' + esc(state.errorMessage) + '</p>';
    }
    return (
      '<h2 class="step-title">정보 제공에도<br />동의하시겠어요?</h2>' +
      '<p class="step-note">선택 항목이며, 동의하지 않으셔도 설명회 참여에는 제한이 없습니다.</p>' +
      '<div class="consent-box">' +
        '<p class="ttl">개인정보 제3자 제공 동의 (선택)</p>' +
        '<p class="body">수집 주체 : 서울주택도시개발공사\n수집·이용 목적 : 정보 제공\n수집 항목 : 성명, 연락처, 이메일, 관심 분야 등\n보유·이용 기간 : 동의일로부터 3년간 보유·이용하며, 동의 철회 시 즉시 파기합니다.\n\n동의하지 않으셔도 행사 참여 및 안내에는 제한이 없습니다.</p>' +
      '</div>' +
      '<div class="consent-choice-row" id="consentChoiceGroup">' +
        '<button type="button" class="consent-choice-btn' + (state.marketingConsent === true ? ' selected' : '') + '" data-choice="agree">동의합니다</button>' +
        '<button type="button" class="consent-choice-btn' + (state.marketingConsent === false ? ' selected decline' : '') + '" data-choice="decline">동의하지 않습니다</button>' +
      '</div>' +
      errorHtml
    );
  }

  function bindConsent2Step() {
    document.getElementById("consentChoiceGroup").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-choice]");
      if (!btn) return;
      state.marketingConsent = btn.getAttribute("data-choice") === "agree";
      renderStep(false);
    });
  }

  function footerHtml() {
    if (state.phase === "applicant") {
      return '<button type="button" class="btn-cta" id="nextBtn" ' + (isApplicantValid() ? "" : "disabled") + '>다음</button>';
    }
    if (state.phase === "companions") {
      return '<button type="button" class="btn-cta" id="nextBtn" ' + (isCompanionsValid() ? "" : "disabled") + '>다음</button>';
    }
    if (state.phase === "site") {
      return '<button type="button" class="btn-cta" id="nextBtn">다음</button>';
    }
    if (state.phase === "consent") {
      return '<button type="button" class="btn-cta" id="nextBtn" ' + (state.privacyConsent ? "" : "disabled") + '>다음</button>';
    }
    if (state.phase === "consent2" || state.phase === "error") {
      return '<button type="button" class="btn-cta" id="submitBtn" ' + (state.marketingConsent === null ? "disabled" : "") + '>신청 제출하기</button>';
    }
    if (state.phase === "submitting") {
      return '<button type="button" class="btn-cta" disabled style="opacity:0.6;">제출하고 있습니다...</button>';
    }
    return "";
  }

  function bindFooter() {
    if (state.phase === "applicant") {
      document.getElementById("nextBtn").addEventListener("click", function () {
        if (!isApplicantValid()) return;
        goTo("companions");
      });
    } else if (state.phase === "companions") {
      document.getElementById("nextBtn").addEventListener("click", function () {
        if (!isCompanionsValid()) return;
        goTo("site");
      });
    } else if (state.phase === "site") {
      document.getElementById("nextBtn").addEventListener("click", function () {
        goTo("consent");
      });
    } else if (state.phase === "consent") {
      document.getElementById("nextBtn").addEventListener("click", function () {
        if (!state.privacyConsent) return;
        goTo("consent2");
      });
    } else if (state.phase === "consent2" || state.phase === "error") {
      document.getElementById("submitBtn").addEventListener("click", submitApplication);
    }
  }

  function updateFooterButtonState() {
    var nextBtn = document.getElementById("nextBtn");
    if (!nextBtn) return;
    if (state.phase === "applicant") nextBtn.disabled = !isApplicantValid();
    else if (state.phase === "companions") nextBtn.disabled = !isCompanionsValid();
  }

  var STEP_RENDERERS = {
    applicant: renderApplicantStep,
    companions: renderCompanionsStep,
    site: renderSiteStep,
    consent: renderConsentStep,
    consent2: renderConsent2Step,
    error: renderConsent2Step,
    submitting: renderConsent2Step
  };
  var STEP_BINDERS = {
    applicant: bindApplicantStep,
    companions: bindCompanionsStep,
    site: bindSiteStep,
    consent: bindConsentStep,
    consent2: bindConsent2Step,
    error: bindConsent2Step,
    submitting: bindConsent2Step
  };

  function renderStep(animate) {
    var bodyHtml = STEP_RENDERERS[state.phase]();
    var stepClass = animate ? "step step-in" : "step step-static";
    root.innerHTML =
      topBarHtml() +
      '<div class="step-region"><div class="' + stepClass + '" id="stepInner">' + bodyHtml + '</div></div>' +
      '<div class="footer-region">' + footerHtml() + '</div>';

    var backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", handleBack);
    STEP_BINDERS[state.phase]();
    bindFooter();
  }

  function renderSuccess() {
    root.innerHTML =
      '<div class="success-shell">' +
        '<div class="success-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h1>신청이 접수되었습니다</h1>' +
        '<p>담당자 검토 후 입력하신 연락처 또는 이메일로<br />설명회 안내를 보내드립니다.</p>' +
        '<a href="index.html" class="btn-outline" style="text-decoration:none;display:block;text-align:center;">메인으로 돌아가기</a>' +
      '</div>';
  }

  function handleBack() {
    if (state.phase === "applicant") {
      goTo("intro");
    } else if (state.phase === "companions") {
      goTo("applicant");
    } else if (state.phase === "site") {
      goTo("companions");
    } else if (state.phase === "consent") {
      goTo("site");
    } else if (state.phase === "consent2" || state.phase === "error") {
      state.errorMessage = "";
      goTo("consent");
    }
  }

  function goTo(phase) {
    state.phase = phase;
    if (phase === "intro") { renderIntro(); return; }
    if (phase === "success") { renderSuccess(); return; }
    renderStep(true);
  }

  function submitApplication() {
    state.phase = "submitting";
    renderStep(true);

    var a = state.applicant;
    var payload = {
      company: a.company.trim(),
      department: a.department.trim() || null,
      manager_name: a.name.trim(),
      position: a.position.trim() || null,
      phone: a.phone.trim(),
      email: a.email.trim(),
      companions: state.companions.map(function (c) {
        return {
          name: c.name.trim(),
          position: (c.position || "").trim() || null,
          phone: c.phone.trim(),
          email: c.email.trim()
        };
      }),
      interested_site: state.interestedSite,
      privacy_consent: true,
      marketing_consent: state.marketingConsent === true
    };

    fetch(SUPABASE_URL + "/rest/v1/applications", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("request failed: " + res.status);
        goTo("success");
      })
      .catch(function () {
        state.errorMessage = "제출 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.";
        state.phase = "error";
        renderStep(true);
      });
  }

  goTo("intro");
})();
</script>

</body>
</html>
