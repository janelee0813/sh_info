<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>참여신청 관리자 | 마곡도시개발지구 복합용지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Freesentation/paperlogy@main/Paperlogy.css">
<style>
  :root {
    --bg: #0B0D10;
    --bg-raise: #15181D;
    --bg-input: #1C2027;
    --ink: #F4F6F8;
    --ink-soft: #9AA4B2;
    --lime: #CFF24C;
    --lime-strong: #9BC200;
    --line: rgba(244,246,248,0.12);
    --line-strong: rgba(244,246,248,0.22);
    --danger: #FF6B6B;
    --radius-pill: 60px;
    --font-display: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-utility: ui-monospace, "SF Mono", "Roboto Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 500;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  @media (max-width: 640px) { .wrap { padding: 0 18px; } }

  /* ---------- Login ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(50% 50% at 50% 0%, rgba(207,242,76,0.1), transparent 65%), var(--bg);
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--bg-raise);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 32px;
  }
  .login-eyebrow {
    font-family: var(--font-utility);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lime);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .login-title { font-size: 1.5rem; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
  .login-sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .field input {
    font-family: var(--font-display);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line-strong);
    background: var(--bg-input);
    color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
  .btn-lime {
    width: 100%;
    appearance: none; border: none; cursor: pointer;
    background: var(--lime);
    color: #0B0D10;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    padding: 14px;
    border-radius: var(--radius-pill);
    transition: background 0.2s ease;
    margin-top: 8px;
  }
  .btn-lime:hover { background: var(--lime-strong); }
  .btn-lime:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error {
    color: var(--danger);
    font-size: 12.5px;
    margin: 4px 0 0;
  }

  /* ---------- Dashboard ---------- */
  #dashScreen { display: none; }
  header.dash-top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,13,16,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 20px 0;
  }
  .dash-top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .dash-brand { display: flex; flex-direction: column; gap: 2px; }
  .dash-brand .org { font-family: var(--font-utility); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; }
  .dash-brand .title { font-weight: 800; font-size: 17px; }
  .dash-actions { display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    appearance: none; cursor: pointer;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius-pill);
  }
  .btn-ghost:hover { border-color: var(--lime); color: var(--lime); }
  .btn-solid-sm {
    appearance: none; cursor: pointer; border: none;
    background: var(--lime);
    color: #0B0D10;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius-pill);
  }
  .btn-solid-sm:hover { background: var(--lime-strong); }

  main { padding: 40px 0 80px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 36px; }
  @media (max-width: 760px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--bg-raise);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .stat-tile .num {
    font-size: 2.1rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-tile .num.lime { color: var(--lime); }
  .stat-tile .label { margin-top: 6px; color: var(--ink-soft); font-size: 0.85rem; font-weight: 600; }

  .toolbar {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .search-input {
    flex: 1; min-width: 220px;
    font-family: var(--font-display);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--line-strong);
    background: var(--bg-raise);
    color: var(--ink);
  }
  .search-input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; min-width: 1180px; }
  thead th {
    text-align: left;
    font-family: var(--font-utility);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--bg-raise);
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    vertical-align: top;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(244,246,248,0.03); }
  td.company { font-weight: 800; }
  td.muted { color: var(--ink-soft); }
  .consent-yes { color: var(--lime); font-weight: 700; }
  .consent-no { color: var(--ink-soft); font-weight: 700; }
  .btn-danger-sm {
    appearance: none; cursor: pointer;
    background: transparent;
    border: 1px solid rgba(255,107,107,0.4);
    color: var(--danger);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .btn-danger-sm:hover { background: rgba(255,107,107,0.12); border-color: var(--danger); }
  .btn-danger-sm:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <p class="login-eyebrow">ADMIN</p>
    <h1 class="login-title">참여신청 관리자</h1>
    <p class="login-sub">마곡도시개발지구 복합용지 사업설명회 참여신청 데이터를 확인합니다.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginPassword">비밀번호</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required autofocus />
      </div>
      <p id="loginError" class="login-error" hidden>비밀번호가 올바르지 않습니다.</p>
      <button type="submit" class="btn-lime" id="loginBtn">로그인</button>
    </form>
  </div>
</div>

<div id="dashScreen">
  <header class="dash-top">
    <div class="wrap dash-top-inner">
      <div class="dash-brand">
        <span class="org">서울특별시 · SH서울주택도시개발공사</span>
        <span class="title">참여신청 관리자 대시보드</span>
      </div>
      <div class="dash-actions">
        <button class="btn-ghost" id="refreshBtn">새로고침</button>
        <button class="btn-solid-sm" id="exportBtn">CSV 다운로드</button>
        <button class="btn-ghost" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stat-row">
      <div class="stat-tile"><div class="num lime" id="statTotal">0</div><div class="label">전체 신청</div></div>
      <div class="stat-tile"><div class="num" id="statToday">0</div><div class="label">오늘 신청</div></div>
      <div class="stat-tile"><div class="num" id="statWeek">0</div><div class="label">최근 7일</div></div>
      <div class="stat-tile"><div class="num" id="statAttendees">0</div><div class="label">총 참석 예정 인원</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="기업명 · 담당자명 · 이메일 검색" />
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>접수일시</th>
            <th>기업(기관)</th>
            <th>부서</th>
            <th>성명</th>
            <th>직함</th>
            <th>연락처</th>
            <th>이메일</th>
            <th>동반 참석자</th>
            <th>관심 부지</th>
            <th>정보제공 동의</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <p class="empty-state" id="emptyState" hidden>아직 접수된 참여신청이 없습니다.</p>
    <p class="loading-state" id="loadingState">불러오는 중...</p>
  </main>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://cbrowpkzgvomnrbyiadd.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicm93cGt6Z3ZvbW5yYnlpYWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzM2NTgsImV4cCI6MjEwMTY0OTY1OH0.nAGpSLkvAiqwvZ3fARBrsHrZbgmzcCFGxSIVYrB5wDA";

  var SITE_LABELS = {
    site_1: '① 발산역 대형(L4·L5·L6)',
    site_2: '② 발산역 중소형(L5·L7)',
    site_3: '③ 올림픽대로 중소형(L1·L2·L3)'
  };

  var loginScreen = document.getElementById('loginScreen');
  var dashScreen = document.getElementById('dashScreen');
  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');

  var allRows = [];
  var currentPassword = '';

  function showDashboard() {
    loginScreen.hidden = true;
    dashScreen.style.display = 'block';
  }
  function showLogin() {
    dashScreen.style.display = 'none';
    loginScreen.hidden = false;
    currentPassword = '';
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.hidden = true;
    loginBtn.disabled = true;
    loginBtn.textContent = '로그인 중...';
    var password = document.getElementById('loginPassword').value;

    fetchApplications(password).then(function (rows) {
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
      currentPassword = password;
      allRows = rows;
      showDashboard();
      document.getElementById('loadingState').hidden = true;
      renderTable(filterRows(document.getElementById('searchInput').value));
      renderStats(allRows);
    }).catch(function () {
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
      loginError.hidden = false;
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    window.location.href = 'index.html';
  });

  document.getElementById('refreshBtn').addEventListener('click', loadApplications);

  document.getElementById('searchInput').addEventListener('input', function (e) {
    renderTable(filterRows(e.target.value));
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var rows = filterRows(document.getElementById('searchInput').value);
    downloadCsv(rows);
  });

  function filterRows(query) {
    query = (query || '').trim().toLowerCase();
    if (!query) return allRows;
    return allRows.filter(function (r) {
      return (r.company || '').toLowerCase().indexOf(query) > -1 ||
        (r.manager_name || '').toLowerCase().indexOf(query) > -1 ||
        (r.email || '').toLowerCase().indexOf(query) > -1;
    });
  }

  function fetchApplications(password) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/get_applications', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ input_password: password })
    }).then(function (res) {
      if (!res.ok) throw new Error('unauthorized');
      return res.json();
    });
  }

  function loadApplications() {
    document.getElementById('loadingState').hidden = false;
    document.getElementById('emptyState').hidden = true;
    fetchApplications(currentPassword).then(function (rows) {
      document.getElementById('loadingState').hidden = true;
      allRows = rows || [];
      renderTable(filterRows(document.getElementById('searchInput').value));
      renderStats(allRows);
    }).catch(function () {
      document.getElementById('loadingState').hidden = true;
      document.getElementById('emptyState').textContent = '데이터를 불러오지 못했습니다. 다시 로그인해주세요.';
      document.getElementById('emptyState').hidden = false;
      showLogin();
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatCompanion(c) {
    var parts = [c.name || ''];
    if (c.position) parts.push(c.position);
    if (c.phone) parts.push(c.phone);
    if (c.email) parts.push(c.email);
    return parts.join(' · ');
  }

  function renderTable(rows) {
    var tbody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');
    tbody.innerHTML = '';
    if (!rows.length) {
      emptyState.textContent = '조건에 맞는 신청 내역이 없습니다.';
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      var created = r.created_at ? new Date(r.created_at).toLocaleString('ko-KR') : '-';
      var companions = Array.isArray(r.companions) ? r.companions : [];
      var companionCell = companions.length
        ? companions.length + '명 (' + companions.map(function (c) { return escapeHtml(formatCompanion(c)); }).join(', ') + ')'
        : '-';
      var siteLabel = r.interested_site ? (SITE_LABELS[r.interested_site] || r.interested_site) : '-';
      tr.innerHTML =
        '<td class="muted">' + escapeHtml(created) + '</td>' +
        '<td class="company">' + escapeHtml(r.company) + '</td>' +
        '<td class="muted">' + escapeHtml(r.department || '-') + '</td>' +
        '<td>' + escapeHtml(r.manager_name) + '</td>' +
        '<td class="muted">' + escapeHtml(r.position || '-') + '</td>' +
        '<td>' + escapeHtml(r.phone) + '</td>' +
        '<td>' + escapeHtml(r.email) + '</td>' +
        '<td class="muted">' + escapeHtml(companionCell) + '</td>' +
        '<td class="muted">' + escapeHtml(siteLabel) + '</td>' +
        '<td class="' + (r.marketing_consent ? 'consent-yes' : 'consent-no') + '">' + (r.marketing_consent ? '동의' : '미동의') + '</td>' +
        '<td><button type="button" class="btn-danger-sm" data-delete-id="' + escapeHtml(r.id) + '">삭제</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('[data-delete-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        handleDelete(btn.getAttribute('data-delete-id'), btn);
      });
    });
  }

  function renderStats(rows) {
    var now = new Date();
    var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    var today = 0, week = 0, attendees = 0;
    rows.forEach(function (r) {
      var created = r.created_at ? new Date(r.created_at) : null;
      if (created && created >= startOfToday) today++;
      if (created && created >= weekAgo) week++;
      var companions = Array.isArray(r.companions) ? r.companions.length : 0;
      attendees += 1 + companions;
    });

    document.getElementById('statTotal').textContent = rows.length;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statWeek').textContent = week;
    document.getElementById('statAttendees').textContent = attendees;
  }

  function handleDelete(id, btn) {
    if (!window.confirm('이 참여신청을 삭제하시겠습니까? 삭제하면 되돌릴 수 없습니다.')) return;
    btn.disabled = true;
    btn.textContent = '삭제 중...';
    fetch(SUPABASE_URL + '/rest/v1/rpc/delete_application', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ input_password: currentPassword, target_id: id })
    }).then(function (res) {
      if (!res.ok) throw new Error('delete failed');
      allRows = allRows.filter(function (r) { return r.id !== id; });
      renderTable(filterRows(document.getElementById('searchInput').value));
      renderStats(allRows);
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = '삭제';
      window.alert('삭제 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.');
    });
  }

  function downloadCsv(rows) {
    var headers = ['접수일시', '기업(기관)', '부서', '성명', '직함', '연락처', '이메일', '동반참석자', '관심부지', '정보제공동의'];
    var lines = [headers.join(',')];
    rows.forEach(function (r) {
      var created = r.created_at ? new Date(r.created_at).toLocaleString('ko-KR') : '';
      var companions = Array.isArray(r.companions) ? r.companions : [];
      var companionText = companions.map(formatCompanion).join(' / ');
      var siteLabel = r.interested_site ? (SITE_LABELS[r.interested_site] || r.interested_site) : '';
      var cells = [
        created, r.company, r.department || '', r.manager_name, r.position || '', r.phone, r.email,
        companionText, siteLabel, r.marketing_consent ? '동의' : '미동의'
      ].map(function (v) {
        var s = String(v == null ? '' : v).replace(/"/g, '""');
        return '"' + s + '"';
      });
      lines.push(cells.join(','));
    });
    var csv = '﻿' + lines.join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '마곡_참여신청_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

})();
</script>

</body>
</html>
